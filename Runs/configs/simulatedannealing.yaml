env: SeqTrust_Bench

script: ../../Tools/boda2/boda/benchmark_SimulatedAnnealing.py

work_dir: ../../Tools/boda2


params:
  # ---- Runtime ----
  device_id: 6

  # ---- Sequence / task ----
  length: 200
  batch_size: 256

  # ---- SimulatedAnnealing hyperparameters ----
  n_proposals: 256
  n_steps: 2000
  n_burnin: 0
  n_positions: 3
  gamma: 0.501
  

  # ---- Datasets: each entry is merged with the params above and triggers one run ----
  data:

    # Complete CellType and SingleCell experiments
    - name: EpisomalMPRA_A549_Complete
      # whether_softplus: True
      save_dir: /home/wangyucheng/projects/SeqEval_Bench_Results/CellType/EpisomalMPRA_A549_Complete/SimulatedAnnealing
      predict_model: alphagenome
      predict_model_ckpt:
        - /home/wangyucheng/projects/SeqEval_Bench_Data/EpisomalMPRA/A549/A549_complete_alphagenome/best_loss_epoch4_loss0.1383.pt
        - /home/wangyucheng/projects/SeqEval_Bench_Data/EpisomalMPRA/HepG2/HepG2_complete_alphagenome/best_loss_epoch1_loss0.1986.pt
        - /home/wangyucheng/projects/SeqEval_Bench_Data/EpisomalMPRA/K562/K562_complete_alphagenome/best_loss_epoch1_loss0.2687.pt
      predict_model_config:
        - /home/wangyucheng/projects/SeqEval_Bench_ExternalSource/huggingface/gtca/alphagenome_pytorch/model_all_folds.safetensors
        - /home/wangyucheng/projects/SeqEval_Bench_ExternalSource/huggingface/gtca/alphagenome_pytorch/model_all_folds.safetensors
        - /home/wangyucheng/projects/SeqEval_Bench_ExternalSource/huggingface/gtca/alphagenome_pytorch/model_all_folds.safetensors
      target_index: 0

  
    - name: EpisomalMPRA_A549_Complete
