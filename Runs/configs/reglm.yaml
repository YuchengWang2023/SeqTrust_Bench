env: SeqTrust_Bench

script: ../../Tools/regLM/benchmark_regLM.py

work_dir: ../../Tools/regLM

params:
  # ---- Runtime ----
  device_id: 7

  # ---- Sequence / task ----
  max_new_tokens: 200
  batch_size: 512
  sample_number: 256
  
  # ---- regLM hyperparameters ----
  max_num: 2000000
  max_epochs: 20
  val_check_interval: 10
  top_k: 2


  # ---- Datasets: each entry is merged with the params above and triggers one run ----
  data:

    # Complete CellType and SingleCell experiments
    - name: EpisomalMPRA_A549_Complete
      data_path: /home/wangyucheng/projects/SeqEval_Bench_Data/EpisomalMPRA/CellType/EpisomalMPRA_complete_starting_sequences_regLM.tsv
      save_dir: /home/wangyucheng/projects/SeqEval_Bench_Results/CellType/EpisomalMPRA_A549_Complete/regLM
      label_len: 3
      prompt: "300"


    - name: EpisomalMPRA_A549_Complete
      data_path: /home/wangyucheng/projects/SeqEval_Bench_Data/EpisomalMPRA/A549/A549_complete.tsv
      save_dir: /home/wangyucheng/projects/SeqEval_Bench_Results/SingleCell/EpisomalMPRA_A549_Complete/regLM
      label_len: 1
      prompt: "3"
